
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#fffaf4">
<title>🌱 WHAT’S NEXT</title>

<style>
:root {
  --bg:#fffaf4;
  --surface:#fff;
  --soft:#f5f0e9;
  --line:#e9e1d7;
  --ink:#292724;
  --muted:#827b72;
  --accent:#78947a;
  --shadow:0 8px 24px rgba(60,45,25,.07);
}
* {box-sizing:border-box;touch-action:manipulation}
html,body {
  touch-action:manipulation;
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
}
body {
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button,input,select {font:inherit;color:inherit}
button {cursor:pointer}
.app {
  width:100%;max-width:none;height:100dvh;min-height:0;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
}

/* TOP BAR */
.topbar {
  display:flex;
  align-items:center;
  gap:0;
  padding:4px 5px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:5;
}
.brand {
  font-size:clamp(16px,4.5vw,20px);
  font-weight:800;
  letter-spacing:-.7px;
  white-space:nowrap;
  flex:1;
  min-width:0;
}
.action {
  width:42px;
  height:42px;
  flex:0 0 42px;
  border:0;
  border-radius:13px;
  background:transparent;
  display:grid;
  place-items:center;
}
.action:active,.menu-btn:active {background:#eee7dc}
.action.action-active{border:1.5px solid #D2C2E5}
.action[data-action="voice"].action-active{background:#F0EAF7;border-color:#D2C2E5;color:#70568A}
.action[data-action="add"].action-active{background:#E7EEE5;border-color:#AFC4AA;color:#47634A}
.action[data-action="search"].action-active{background:#E8EDF6;border:1.5px solid #B9C9E2;color:#52658B}
.action[data-action="search"].action-active{background:#E8EDF6;border-color:#B9C9E2;color:#52658B}
.action[data-action="shopping"].action-active{background:#F7F0DE;border-color:#E4D6B5;color:#786943}
.settings-panel,.database-trash{padding:14px;border-radius:14px;background:#fff;border:1px solid #e9e1d7}
.settings-panel h3,.database-trash h3{margin:0 0 12px;font-size:17px}
.settings-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee8df;font-size:14px}
.settings-line select{max-width:55%;padding:7px;border:1px solid #ddd4c8;border-radius:8px;background:#fff}
.settings-subtitle{font-weight:700;margin:16px 0 4px}
.settings-line button{border:1px solid #ddd4c8;border-radius:8px;background:#fff;padding:5px 10px}
.action svg {
  width:23px;
  height:23px;
  stroke:currentColor;
}

/* MAIN PANELS — compact, consistent full-height sections */
main {flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:0}
.panels{display:flex;flex-direction:column;gap:0;min-height:100%;align-items:stretch}
.panel{width:100%;min-width:0;min-height:0;display:flex;flex-direction:column;flex:0 0 auto;background:#fff;border:0;border-radius:0;overflow:visible;box-shadow:none}
.panel-body{width:100%;min-width:0;padding:0 5px;background:transparent;min-height:calc(100dvh - 132px);flex:0 0 auto;display:flex;flex-direction:column}
/* Every opened menu fills the same content area; each uses its own very-light pastel tint. */
.panel[data-panel="check"] .panel-body{background:#FFF1EF}
.panel[data-panel="meal"] .panel-body{background:#FFFAF5}
.panel[data-panel="calendar"] .panel-body{background:#FAF9F5}
.panel[data-panel="map"] .panel-body{background:#F6F9FF}
.panel[data-panel="someday"] .panel-body{background:#FFFCED}
.panel[data-panel="benefits"] .panel-body{background:#F4FBF5}
.panel[data-panel="travel"] .panel-body{background:#FAF7FF}
.panel[data-panel="scrapbook"] .panel-body{background:#FFF5F8}
.panel[data-panel="gallery"] .panel-body{background:#F4F2FF}
.panel[data-panel="database"] .panel-body{background:#F5FAF1}
.panel[data-panel="settings"] .panel-body{background:#F8F9FA}
.panel[data-panel="shopping"] .panel-body{background:#FCF8EE}
.panel[data-panel="shopping"] .embedded-frame{background:#FCF8EE}
.panel[data-panel="check"]{--panel-accent:#C96F68}.panel[data-panel="meal"]{--panel-accent:#D98A5B}.panel[data-panel="calendar"]{--panel-accent:#9B927D}.panel[data-panel="map"]{--panel-accent:#83A8D4}.panel[data-panel="someday"]{--panel-accent:#D6B85D}.panel[data-panel="benefits"]{--panel-accent:#79AD8B}.panel[data-panel="travel"]{--panel-accent:#A28AC8}.panel[data-panel="scrapbook"]{--panel-accent:#D68EAA}.panel[data-panel="gallery"]{--panel-accent:#9B88C8}.panel[data-panel="database"]{--panel-accent:#91A97E}.panel[data-panel="settings"]{--panel-accent:#929AA5}.panel[data-panel="shopping"]{--panel-accent:#B59B5D}
.panel-body button,.panel-body .tab,.panel-body .chip{ -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none }
.panel-body button:focus{outline-color:var(--panel-accent,#b7a3e5)}
.panel-body .tab.active,.panel-body button.active,.panel-body .chip.selected{background:color-mix(in srgb,var(--panel-accent,#b7a3e5) 24%,white);border-color:color-mix(in srgb,var(--panel-accent,#b7a3e5) 55%,white)}
.panel.is-hidden {
  height:0 !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  overflow:hidden !important;
  opacity:0;
  pointer-events:none;
}
.embedded-frame{display:block;width:100%;height:calc(100dvh - 132px);min-height:0;flex:0 0 auto;border:0;border-radius:0;background:transparent}

.tabs {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.tab {
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
}
.tab.active {
  background:#e8eee6;
  border-color:#c9d7c8;
  color:#405b42;
  font-weight:700;
}
.placeholder {
  font-size:14px;
  color:var(--muted);
  padding:8px 0;
}
.map-placeholder {
  height:150px;
  border-radius:12px;
  background:linear-gradient(135deg,#e9eee6,#f2eadf);
  display:grid;
  place-items:center;
  color:#697867;
  font-size:14px;
}

/* BOTTOM MENUS — inactive is neutral; color marks an opened section */
.bottom{position:sticky;bottom:0;background:var(--bg);padding:4px 5px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:4}
.menu-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.menu-btn{height:30px;min-width:0;flex:1;border:1px solid #E7E1D9;border-radius:8px;background:#FFFEFC;color:#827B72;display:grid;place-items:center;padding:0;box-shadow:none;transform:none}
.menu-btn svg{width:17px;height:17px}
.menu-btn.active{background:#E7EEE5;border:2px solid #AFC4AA;color:#47634A;box-shadow:inset 0 0 0 1px #fff}
.menu-btn[data-menu="check"].active{background:#F7D7D3;border-color:#D88780;color:#91443E}.menu-btn[data-menu="meal"].active{background:#FBE7D7;border-color:#DFA477;color:#92562F}.menu-btn[data-menu="someday"].active{background:#F8EFCB;border-color:#D9C16F;color:#806625}
.menu-btn[data-menu="calendar"].active{background:#EAE6DC;border-color:#C2B9A7;color:#6D6558}
.menu-btn[data-menu="map"].active{background:#DCE7F7;border-color:#A8BCDE;color:#465B83}
.menu-btn[data-menu="shopping"].active{background:#F0E5C9;border-color:#D9C79A;color:#705E35}
.menu-btn[data-menu="travel"].active{background:#E8DDF3;border-color:#C5AFE0;color:#654B80}
.menu-btn[data-menu="scrapbook"].active{background:#F5DDE7;border-color:#DFAFC3;color:#80485F}.menu-btn[data-menu="gallery"].active{background:#E5E0F8;border-color:#B9ABE0;color:#594782}
.menu-btn[data-menu="benefits"].active{background:#DCECEF;border-color:#AFCFD6;color:#426B76}.menu-btn[data-menu="database"].active{background:#DCEAF7;border-color:#B0CBE6;color:#496987}
.utility-row{display:flex;align-items:center;justify-content:space-around;gap:3px;margin-top:2px;padding-top:2px;border-top:1px solid var(--line)}
.utility-row .menu-btn{height:27px;min-width:0;flex:1;background:#FFFEFC;color:#827B72}
.utility-row .menu-btn svg{width:16px;height:16px}
.utility-row .menu-btn.active{background:#F1EAF6;border:2px solid #D4C2E2;color:#705786}
.utility-row .menu-btn[data-menu="gallery"].active{background:#E5E0F8;border-color:#B9ABE0;color:#594782}
.utility-row .menu-btn[data-menu="database"].active{background:#DCEAF7;border-color:#B0CBE6;color:#496987}
.utility-row .menu-btn[data-menu="settings"].active{background:#EEECE8;border-color:#D1CDC4;color:#68645C}

/* UNIQUE SECTION COLORS — each menu has its own visual identity */
.menu-btn.active[data-menu="check"]{background:#FBE5E5;border-color:#E9B7B7;color:#A64F55}
.menu-btn.active[data-menu="meal"]{background:#FBECE2;border-color:#EAC8AE;color:#986344}
.menu-btn.active[data-menu="calendar"]{background:#F0EEE9;border-color:#D1CABC;color:#716B60}
.menu-btn.active[data-menu="map"]{background:#E8EDF6;border-color:#B9C9E2;color:#52658B}
.menu-btn.active[data-menu="someday"]{background:#F8F1D9;border-color:#E8D99F;color:#8A7438}
.menu-btn.active[data-menu="benefits"]{background:#E5F1EF;border-color:#B7D8D1;color:#47766D}
.menu-btn.active[data-menu="travel"]{background:#F0EAF7;border-color:#D2C2E5;color:#70568A}
.menu-btn.active[data-menu="scrapbook"]{background:#F8EAF0;border-color:#E8C9D6;color:#88596D}
.menu-btn.active[data-menu="gallery"]{background:#FBE9E5;border-color:#EBC3B9;color:#A45F52}
.menu-btn.active[data-menu="database"]{background:#E8F2E8;border-color:#C0D9BE;color:#557A52}
.menu-btn.active[data-menu="settings"]{background:#ECEEF1;border-color:#C8CDD5;color:#5E6877}
.menu-btn.active[data-menu="shopping"]{background:#F7F0DE;border-color:#E4D6B5;color:#786943}

/* INLINE QUICK ACTIONS */
.shopping-dock{display:none;padding:8px 12px 12px;background:var(--bg)}.shopping-dock.show{display:block}.shopping-dock .panel{display:block;margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.shopping-dock .panel-toolbar{justify-content:stretch;gap:6px;padding:2px 4px;background:#fff}.shopping-dock .panel-head{display:flex;min-height:48px;padding:11px 12px;gap:9px}.shopping-dock .panel-head svg{width:20px;height:20px}.shopping-dock .panel-body{background:#fff;padding:0}.shopping-dock .panel.collapsed .panel-body{height:0;min-height:0;overflow:hidden}.shopping-dock iframe{display:block;width:100%;height:min(68dvh,620px);min-height:260px;border:0;border-radius:0;background:transparent}
.quick-dock {display:none;padding:9px 12px 11px;background:#fff;border-bottom:1px solid var(--line)}
.quick-dock.show {display:block}
.quick-dock-inner {display:grid;gap:8px}
.quick-dock-title {font-size:13px;font-weight:750;color:var(--muted)}
.quick-dock textarea{width:100%;min-width:0;min-height:48px;max-height:55dvh;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit;font-size:16px;line-height:1.45;resize:none;overflow-y:auto}
.quick-dock input,.quick-dock select {
  width:100%;min-width:0;min-height:42px;padding:10px 12px;
  border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:16px;
}
.quick-dock-actions {display:flex;gap:7px;align-items:center}
.quick-dock-actions button {
  min-height:36px;padding:7px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:13px
}
.quick-dock-actions .primary {background:#e7eee5;border-color:#cdd9ca;font-weight:700}
.quick-results {display:grid;gap:0;max-height:34vh;overflow:auto}
.quick-records{padding:10px 12px 12px;background:#fffdf9;border-bottom:1px solid var(--line)}
.quick-records:empty{display:none}
.quick-records-title{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:7px}
.quick-record-card{display:flex;align-items:center;gap:8px;padding:8px 9px;margin-top:5px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}
.quick-record-card span{min-width:0;overflow-wrap:anywhere;flex:1}
.quick-record-card small{color:var(--muted);white-space:nowrap;font-size:10px}
.quick-record-card button{flex:0 0 auto;min-width:34px;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#f8f5ef;font-size:11px}.quick-record-card .draft-edit{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left}.quick-record-card .draft-edit span{overflow-wrap:anywhere}
@media(max-width:699px){input,select,textarea{font-size:16px!important}}
.quick-result {display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.quick-result small {color:var(--muted);white-space:nowrap}
.action.listening {background:#fbe7e5;color:#a43c35}
@media(min-width:700px) {
  .menu-grid {grid-template-columns:repeat(12,minmax(0,1fr))}
  .quick-dock {padding-left:18px;padding-right:18px}
}

/* POPUP */
.overlay {
  position:fixed;
  inset:0;
  background:rgba(28,25,20,.24);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
  padding:12px;
}
.overlay.show {display:flex}
.sheet {
  width:min(100%,560px);
  max-height:82dvh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.18);
}
.sheet h2 {font-size:18px;margin:0 0 16px}
.sheet-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #eee8df;
  font-size:14px;
}
.sheet-row:last-child {border-bottom:0}
.sheet button,.primary {
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  padding:8px 11px;
}
.sheet select {
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px;
  background:#fff;
}
.sheet .close {
  float:right;
  border:0;
  background:transparent;
  font-size:22px;
  padding:0 4px;
}
.toast {
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#302e2a;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:30;
  white-space:nowrap;
}
.toast.show {opacity:1}

@media(min-width:700px) {
  body {padding-left:24px;padding-right:24px}
  .panels {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:start;
  }
  .panel {min-width:0}
  .menu-grid {grid-template-columns:repeat(12,minmax(0,1fr))}
}
@media(max-width:370px) {
  .brand {font-size:15px;letter-spacing:-.8px}
  .action {width:40px;flex-basis:40px}
  .action svg {width:22px;height:22px}
}
</style>
</head>

<header class="topbar">
  <div class="brand">🌱 WHAT’S NEXT</div>

  <button class="action" aria-label="음성 입력" data-action="voice">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

</div>

function quickShoppingBatch(text){
 const lines=String(text||'').split(/\\n+/),out=[];let store='';
 const keys=[['costco',/^(costco|코스트코)$/i],['trader-joes',/^(trader\\s*joe'?s|tj'?s|트레이더\\s*조)$/i],['whole-foods',/^(whole\\s*foods?|홀푸드)$/i],['korean-market',/^(korean\\s*market|한인\\s*마트|한국\\s*마트)$/i]];
 for(let raw of lines){let line=raw.trim().replace(/^[-*•▪︎]+\\s*/,'');if(!line)continue;
  let inline=line.match(/^(costco|trader\\s*joe'?s|whole\\s*foods?|korean\\s*market|한인\\s*마트|한국\\s*마트)\\s*[:：-]\\s*(.+)$/i);
  if(inline){const k=keys.find(x=>x[1].test(inline[1]));if(k)store=k[0];line=inline[2]}
  else{const k=keys.find(x=>x[1].test(line));if(k){store=k[0];continue}}
  line.split(/[,;，；]+/).map(x=>x.trim()).filter(Boolean).forEach(name=>out.push({name,store:store||undefined,priority:'urgent'}));
 }
 return out;
}

  const editId=Number(input.dataset.editId||0),old=quickRecords.find(r=>r.id===editId);
  if(old){old.title=title;old.type=type;old.updatedAt=new Date().toISOString()}
  else quickRecords.unshift({id:Date.now(),title,type,createdAt:new Date().toISOString()});
  persistQuick();refreshQuickRecordPanels();if(input){input.value='';delete input.dataset.editId}closeQuickDock();toast(type==='임시 보관함'?'임시 보관했어요':'저장했어요');
}
function deleteQuickRecord(id){const r=quickRecords.find(x=>x.id===id);if(!r)return;if(!confirm('“'+r.title+'” 기록을 삭제할까요?'))return;quickRecords=quickRecords.filter(x=>x.id!==id);persistQuick();refreshQuickRecordPanels();renderQuickInbox();toast('기록을 삭제했어요')}
function sendQuickRecordToMeal(id,destination){const r=quickRecords.find(x=>x.id===id);if(!r)return;if(!state.opened.includes('meal'))toggleMenu('meal');const frame=document.querySelector('#mealFrame');const run=()=>{const w=frame?.contentWindow,fn=destination==='recipe'?'WN_ADD_QUICK_RECIPE':'WN_ADD_QUICK_PLAN';if(typeof w?.[fn]!=='function'){toast('밀 플랜을 불러오지 못했어요. 다시 시도해 주세요.');return}if(w[fn](r.title)){quickRecords=quickRecords.filter(x=>x.id!==id);persistQuick();refreshQuickRecordPanels();renderQuickInbox();toast(destination==='recipe'?'레시피로 옮겼어요':'밀 플랜에 담았어요')}};if(frame?.contentWindow?.WN_ADD_QUICK_RECIPE||frame?.contentWindow?.WN_ADD_QUICK_PLAN)run();else if(frame)frame.addEventListener('load',run,{once:true});else toast('밀 플랜 메뉴를 열어 주세요')}
function collectSearchRows(){
  let rows=quickRecords.map(r=>({title:r.title,type:r.type}));
  try{const md=JSON.parse(localStorage.getItem('whatsnext_mealplanner_v1')||'null');if(md&&Array.isArray(md.recipes))rows.push(...md.recipes.map(r=>({title:r.name||'',type:'Recipe'})))}catch(e){}
  try{const sd=JSON.parse(localStorage.getItem('wn-shopping-items-v3')||'[]');if(Array.isArray(sd))rows.push(...sd.map(r=>({title:r.name||'',type:'Shopping'})))}catch(e){}
  return rows;
}
function runGlobalSearch(){
  const q=document.querySelector('#globalSearch')?.value.trim().toLowerCase()||'',out=document.querySelector('#globalResults');if(!out)return;
  const rows=collectSearchRows().filter(r=>(r.title+' '+r.type).toLowerCase().includes(q));
  const safe=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  out.innerHTML=q?(rows.length?rows.map(r=>'<div class="quick-result"><span>'+safe(r.title)+'</span><small>'+safe(r.type)+'</small></div>').join(''):'<div class="placeholder">검색 결과가 없어요.</div>'):'';
}
function startVoiceRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const status=document.querySelector('#voiceStatus'),input=document.querySelector('#quickText');
  if(!SR){if(status)status.textContent='이 브라우저는 음성 인식을 지원하지 않아요. 아래에 직접 입력할 수 있어요.';toast('음성 인식은 Chrome 등 지원 브라우저에서 이용해 주세요');return}
  if(activeRecognition){try{activeRecognition.stop()}catch(e){}}
  const rec=new SR();activeRecognition=rec;rec.lang=appLanguage==='ko'?'ko-KR':'en-US';rec.continuous=false;rec.interimResults=true;
  if(status)status.textContent='🔴 듣고 있어요…';
  document.querySelector('[data-action="voice"]')?.classList.add('listening');
  rec.onresult=e=>{
    let transcript='';for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
    if(input)input.value=transcript;
    if(status)status.textContent=e.results[e.results.length-1].isFinal?'내용을 확인하고 저장하거나 검색하세요':'듣고 있어요…';
  };
  rec.onerror=e=>{if(status)status.textContent=e.error==='not-allowed'?'마이크 권한을 허용해 주세요.':'음성을 인식하지 못했어요. 다시 말하거나 직접 입력해 주세요.';document.querySelector('[data-action="voice"]')?.classList.remove('listening');activeRecognition=null};
  rec.onend=()=>{document.querySelector('[data-action="voice"]')?.classList.remove('listening');if(activeRecognition===rec)activeRecognition=null;if(status&&status.textContent==='🔴 듣고 있어요…')status.textContent='말씀이 끝났어요. 내용을 확인해 주세요.'};
  try{rec.start()}catch(err){if(status)status.textContent='마이크를 시작할 수 없어요. 다시 눌러 주세요.';activeRecognition=null}
}
function flushShopping(){const f=window._shopFrame;if(!f||!f.contentWindow)return;const target=f.contentWindow;if(typeof target.addShoppingItem!=='function')return;const batch=pendingShopping.splice(0);batch.forEach(item=>target.addShoppingItem(item))}
let pendingShopping=[];
window.addEventListener('message',event=>{if(event.source!==document.querySelector('#mealFrame')?.contentWindow||event.data?.type!=='WN_MEAL_SHOPPING_ADD'||!Array.isArray(event.data.items))return;pendingShopping.push(...event.data.items);flushShopping();toast('재료를 쇼핑리스트로 보냈어요')});
function toggleShoppingDock(){closeQuickDock();toggleMenu('shopping')}

const actionColors={voice:'#F0EAF7',add:'#E7EEE5',search:'#E8EDF6',shopping:'#F7F0DE'};
document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=()=>{const a=b.dataset.action;if(a==='add'||a==='search'||a==='voice'){setQuickMode(a)}else if(a==='shopping'){b.classList.toggle('action-active');toggleShoppingDock()}}});
render();
</script>
